<template id="tpl-hurts">
  <div class="section-card">
    <h2>Sound familiar?</h2>
    <p class="hand">little moments that add up</p>
    <div class="moments">
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Your notes are out of reach.</b><span>On the train, on your phone, and the notes are somewhere awkward.</span>
        <div class="more">
          <p>You’re on the train with twenty minutes and a good thought for your worldbuilding project. The notes are on a computer at home, or in a cloud drive whose web view shows Markdown as a wall of symbols.</p>
          <p>So the thought goes into a chat with yourself, a sticky note, or nowhere. Later you can’t find it.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Copy, paste, explain. Again.</b><span>Every chat starts with pasting in the same notes.</span>
        <div class="more">
          <p>You open a new chat and paste in the outline, the list of characters, the decisions from last week. The AI is clever, but it starts from zero every time.</p>
          <p>Five chats later there are five slightly different copies of your notes, and none of them is the one you actually keep.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>The AI writes, you tidy up.</b><span>You get a block of text, not an updated note.</span>
        <div class="more">
          <p>You ask it to add the new idea to your notes. It hands you a block of text, and you paste it in, fix the headings and delete the part that was already there.</p>
          <p>Coding agents have worked differently for a while: they open the file, change the lines that need changing and tell you what they did. Your notes deserve the same.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Every tool remembers a little.</b><span>Different tools for different jobs, and none of them share.</span>
        <div class="more">
          <p>One AI helps with code, another lives on your phone, a third drafts your texts. Each keeps its own little memory.</p>
          <p>What Claude Code worked out with you this morning is news to the chat on your phone tonight. You end up as the messenger between your own tools.</p>
        </div></div>
      <div class="moment ask" role="button" tabindex="0" aria-haspopup="dialog"><b>“But doesn’t my AI already remember things?”</b><span>It does, for itself. A Kumbu² vault is yours, and shared.</span>
        <div class="more">
          <p>It does. Assistants keep memories and projects now, and they’re useful. But that memory belongs to one app: another AI can’t read it, and it isn’t a set of notes you can open in your own editor and take with you.</p>
          <p>A Kumbu² vault is a folder of notes that belongs to you. Every app and every AI you invite sees the same one, and you can read and change everything they wrote.</p>
          <p>So you don’t have to pick one assistant to remember for you. Your notes do the remembering; the assistants come and go.</p>
        </div></div>
    </div>
  </div>
</template>

<template id="tpl-helps">
  <div class="section-card">
    <h2>One calm place for your notes</h2>
    <p class="hand">your notes, wherever you think</p>
    <div class="moments">
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Open your notes anywhere.</b><span>A web app for phone and laptop. Install it like an app.</span>
        <div class="more">
          <p>Kumbu² comes with a web app made for the phone first, and comfortable on a laptop too. Read, write, search, and look at earlier versions of a note.</p>
          <p>Add it to your home screen and it opens like any other app. No app store involved.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Your AI works right inside.</b><span>Add Kumbu² to your assistant once. It edits your notes directly.</span>
        <div class="more">
          <p>Add Kumbu² to your assistant once: paste an address, sign in, allow. From then on it can look things up in your notes, search them by words and by meaning, and change them in place.</p>
          <p>When you come back, Kumbu² shows you what it changed, line by line. If you don’t like a change, you go back to the version before.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Keep using Obsidian.</b><span>Pair it with a short code, and your notes sync both ways.</span>
        <div class="more">
          <p>If you write in Obsidian, keep doing that. Add the Kumbu² plugin, type in the short code Kumbu² shows you, and your vault stays in step, on your laptop and on your phone.</p>
          <p>No key or password to copy around: the web app shows your server’s address with a copy button, and a short code you type in once. Each device gets its own key, so if a phone goes missing, you switch off just that one.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Safe by default.</b><span>Stored encrypted, easy to undo, and you choose who sees what.</span>
        <div class="more">
          <p>Your notes are stored encrypted, even their names and folders, so a stolen backup shows nothing readable. Earlier versions are kept, deleted notes wait in a trash for 30 days, and you can mark a moment to come back to later.</p>
          <p>Each app you connect sees only the vaults you pick, and read-only if you like. One honest word: what an AI reads, the company behind it sees too. So give each app only what you’d show it.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>It becomes a memory palace.</b><span>Your AI finds its way around and files things where they belong.</span>
        <div class="more">
          <p>A capable model finds its way around a well-kept vault: it reads the folder names, follows the links and puts new things where they belong instead of on a pile.</p>
          <p>Over time the vault grows into a shared memory, one that you and your AI both use, and both keep tidy.</p>
        </div></div>
    </div>
  </div>
</template>

<template id="tpl-works">
  <div class="section-card">
    <h2>How it works</h2>
    <p class="hand">a tidy folder of notes, on a server you trust</p>
    <div class="moments">
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Each vault is a folder of notes.</b><span>Laid out the way Obsidian lays out a vault.</span>
        <div class="more">
          <p>Notes are plain Markdown, in folders, with links between them and headings inside them. Nothing proprietary, nothing locked in.</p>
          <p>Export a vault as a ZIP and Obsidian opens it as it is. One vault for work, one for a worldbuilding project, one for the garden.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>The Obsidian plugin.</b><span>Syncs both ways, on laptop and phone. Conflicts lose nothing.</span>
        <div class="more">
          <p>The plugin keeps one Obsidian vault and one Kumbu² vault in step. While you’re online, a change on either side shows up on the other within seconds; offline, it catches up the next time you open Obsidian.</p>
          <p>The first time, notes on only one side are simply copied across. If a note differs on both sides, you’re asked once, for all of them: keep both, keep local, or keep Kumbu². Whichever you pick, the other text is kept where you can find it. After that, if both sides changed the same note, you get both versions next to each other.</p>
          <p>How to add the plugin is explained in <a href="https://github.com/SCAI-NGO/kumbu-obsidian" target="_blank" rel="noopener">its README</a>.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>An editor for on the go.</b><span>No Obsidian at hand? Open the web app.</span>
        <div class="more">
          <p>On a borrowed laptop or a phone without Obsidian, open Kumbu² in the browser and write. It saves as you go, and tells you if your AI changed the note in the meantime.</p>
          <p>Search, earlier versions and the trash are all there too.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Any AI that speaks MCP.</b><span>Not just one assistant: all of them, sharing one memory.</span>
        <div class="more">
          <p>MCP, the Model Context Protocol, is a common plug that lets AI apps use tools, a bit like USB for assistants. Kumbu² has that plug.</p>
          <p>So Claude, Claude Code, <a href="https://hermes-agent.nousresearch.com" target="_blank" rel="noopener">Hermes Agent</a>, <a href="https://teaser.chatsundere.me" target="_blank" rel="noopener">Chatsundere</a> and any other app that connects AI to tools this way can read, search and edit your vaults.</p>
          <p>What Claude Code worked out this morning is waiting for the chat on your phone tonight.</p>
        </div></div>
    </div>
  </div>
</template>

<template id="tpl-run">
  <div class="section-card">
    <h2>Run your own</h2>
    <p class="hand">for the folks with a server and a free evening (well, five minutes)</p>
    <div class="moments">
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Free software.</b><span>AGPL-3.0-or-later: use it, change it, host it.</span>
        <div class="more">
          <p>Kumbu² is licensed under the GNU Affero General Public License, version 3 or later. You may use it, study it, change it and host it for anyone, free of charge.</p>
          <p>The one condition: if you change it and let others use your version over a network, offer them the source of your changes too. <a href="https://github.com/SCAI-NGO/kumbukumbu/blob/master/LICENSE" target="_blank" rel="noopener">The licence in full</a>.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>One compose file.</b><span><code>compose.yaml</code>, a <code>.env</code>, <code>docker compose up</code>.</span>
        <div class="more">
          <p>Take the repository’s <a href="https://github.com/SCAI-NGO/kumbukumbu/blob/master/compose.yaml" target="_blank" rel="noopener"><code>compose.yaml</code></a>, which pulls the published image, and make a <code>.env</code> from <a href="https://github.com/SCAI-NGO/kumbukumbu/blob/master/.env.example" target="_blank" rel="noopener"><code>.env.example</code></a>. Set <code>KUMBU_PUBLIC_URL</code>, run <code>docker compose up -d</code>, and create the first admin with <code>docker compose exec kumbu kumbu bootstrap-admin</code>.</p>
          <p>Put a TLS-terminating reverse proxy in front; the README lists what claude.ai needs to reach it. The reference install with Komodo took about five minutes.</p>
        </div></div>
      <div class="moment" role="button" tabindex="0" aria-haspopup="dialog"><b>Under the hood.</b><span>.NET 10, MongoDB, AES-256-GCM, Argon2id, MCP with OAuth.</span>
        <div class="more">
          <p>Each vault is an Obsidian-compatible virtual file system: top-level folders are vaults, wikilinks resolve the way Obsidian resolves them, and agents work in it through a small shell (<code>ls</code>, <code>cat</code>, <code>rg</code>, <code>history</code>, <code>restore</code>) plus <code>write</code> and <code>edit</code> tools with optimistic version checks.</p>
          <p>A .NET 10 server on MongoDB. Every vault has its own key; notes, their history and even paths are sealed with AES-256-GCM before they reach the database, keys are stored only wrapped, and passwords go through Argon2id. Agents connect over MCP with API keys, or as OAuth connections for claude.ai and other apps. Embeddings for search by meaning are computed in-process by default, so notes are sent out to be embedded only if a vault’s owner picks an outside provider.</p>
          <p>The details, with the threat model and its limits: <a href="https://github.com/SCAI-NGO/kumbukumbu/blob/master/docs/security-architecture.md" target="_blank" rel="noopener">the security architecture</a>.</p>
        </div></div>
    </div>
  </div>
</template>
