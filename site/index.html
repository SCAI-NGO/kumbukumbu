<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumbu² — coming soon</title>
<meta name="description" content="Kumbu² is one calm place for your notes — on every device, and for every AI you think with. Coming soon.">
<link rel="stylesheet" href="assets/teaser.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1>Kumbu<sup>2</sup></h1>
    <p class="tag">One calm place for your notes — on every device, and for every AI you think with.</p>
  </header>

  <svg class="garden" viewBox="90 50 470 270" role="img" aria-label="A small sprout growing from a pencil line into a bud, with the handwritten words coming soon">
    <defs>
      <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
      </filter>
    </defs>

    <g class="pencil">
      <path class="ground" d="M100 302 C 190 296, 250 308, 320 301 S 470 295, 550 303"/>
      <path class="stem" style="animation-delay:1.0s" d="M300 300 C 292 245, 316 190, 304 128"/>
      <path class="leaf" style="transform-origin:left bottom;animation-delay:2.0s" d="M299 244 C 326 226, 348 230, 356 238 C 336 254, 314 256, 299 244 Z"/>
      <path class="leaf" style="transform-origin:right bottom;animation-delay:2.3s" d="M297 205 C 272 189, 252 193, 244 201 C 262 216, 284 218, 297 205 Z"/>
    </g>

    <g class="bud">
      <g class="sway"><g class="bloom pencil" style="animation-delay:2.6s">
        <g transform="translate(304 108)">
          <ellipse class="petal" cx="-12" cy="-10" rx="11" ry="22" transform="rotate(-24 -12 12)"/>
          <ellipse class="petal" cx="12" cy="-10" rx="11" ry="22" transform="rotate(24 12 12)"/>
          <ellipse class="petal" cx="0" cy="-14" rx="12" ry="25"/>
          <circle class="heart" cx="0" cy="14" r="5"/>
        </g>
      </g></g>
    </g>
    <text class="soon pencil" x="350" y="100">coming soon</text>
  </svg>

  <footer class="links">
    <a href="https://github.com/SCAI-NGO/kumbukumbu" target="_blank" rel="noopener">the code on GitHub</a>
    <svg class="dot" viewBox="-14 -14 28 28" aria-hidden="true">
      <g class="dot-petals">
        <ellipse cy="-7" rx="4.5" ry="7"/><ellipse cy="-7" rx="4.5" ry="7" transform="rotate(72)"/>
        <ellipse cy="-7" rx="4.5" ry="7" transform="rotate(144)"/><ellipse cy="-7" rx="4.5" ry="7" transform="rotate(216)"/>
        <ellipse cy="-7" rx="4.5" ry="7" transform="rotate(288)"/>
      </g>
      <circle class="dot-heart" r="3"/>
    </svg>
    <a href="https://scai.world" target="_blank" rel="noopener">made by SCAI</a>
  </footer>
</div>

</body>
</html>
