description: The text to embed is at most 2,000 characters and not blank, from a parameter or a literal alike; a literal text runs without arguments.
source: spec
notes:
  Queries/By topic.md: |
    ---
    type: query
    params:
      topic:
        type: text
    meaning:
      property: summary
      text: topic
    ---
    ```base
    filters: file.inFolder("Notes")
    views:
      - type: table
        name: By topic
        order: [file.basename, closeness]
    ```
  Queries/Literal.md: |
    ---
    type: query
    meaning:
      property: summary
      text: "offline sync"
    ---
    ```base
    filters: file.inFolder("Notes")
    views:
      - type: table
        name: Literal
        order: [file.basename, closeness]
    ```
  Notes/Same.md: |
    ---
    summary: Offline sync conflicts
    ---
vectors:
  query: [1, 0]
  notes:
    Notes/Same.md: [1, 0]
offline: { error: meaning-offline }
runs:
  - query: Queries/By topic.md
    args: { topic:  }
    error: param-value
  - query: Queries/By topic.md
    args: { topic:  }
    columns: [file.basename, closeness]
    rows:
      - [text Same, number 1]
  - query: Queries/By topic.md
    args: { topic: "   " }
    error: param-value
  - query: Queries/By topic.md
    args: {}
    error: param-value
  - query: Queries/Literal.md
    columns: [file.basename, closeness]
    rows:
      - [text Same, number 1]
