description: A declared datetime reads a date as its midnight; a declared date reads a datetime as its day.
source: spec
types:
  meeting: datetime
  due: date
notes:
  Ann.md: |
    ---
    meeting: 2026-11-23
    due: 2026-11-30T09:00
    ---
expect:
  properties:
    Ann.md:
      meeting: datetime 2026-11-23T00:00:00
      due: date 2026-11-30
