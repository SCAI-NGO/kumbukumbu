description: A declared list reads a single value as a list of one, and so do aliases in every vault; a list stays the list, its items keeping their own types.
source: kumbu
reason: Obsidian 1.15.1 doesn't make a single value a list (finding 13), so aliases Annie is a text and contains() looks inside its letters; a list property means a list (ADR 0041).
types:
  related: multitext
notes:
  Ann.md: |
    ---
    aliases: Annie
    related: Brita
    ---
  Brita.md: |
    ---
    related: [Ann, 42]
    ---
expect:
  properties:
    Ann.md:
      aliases: [text Annie]
      related: [text Brita]
    Brita.md:
      related: [text Ann, number 42]
