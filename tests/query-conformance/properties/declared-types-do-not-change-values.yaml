description: A declared type doesn't change a value, whether the value fits it or not; each reads as YAML reads it.
source: spec
types:
  birthday: date
  rating: number
  done: checkbox
  flag: text
  meeting: datetime
notes:
  Ann.md: |
    ---
    birthday: soon
    rating: high
    done: yes
    flag: true
    meeting: 2026-11-23
    ---
expect:
  properties:
    Ann.md:
      birthday: text soon
      rating: text high
      done: text yes
      flag: boolean true
      meeting: date 2026-11-23
