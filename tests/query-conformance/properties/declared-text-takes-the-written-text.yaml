description: A declared text keeps a plain number, a date and a checkbox as the text they were written as.
source: kumbu
reason: Obsidian 1.15.1 ignores types.json for a base's values (finding 10), so a zip code 01010 declared a text becomes the number 1010; whoever declares a text means the text as written (ADR 0041).
types:
  zip: text
  code: text
  flag: text
notes:
  Ann.md: |
    ---
    zip: 01010
    code: 2026-11-23
    flag: true
    ---
expect:
  properties:
    Ann.md:
      zip: text 01010
      code: text 2026-11-23
      flag: text true
