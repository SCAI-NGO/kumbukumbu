description: A tags property gives its tags with their '#', a '#' already written kept once; tags and cssclasses are lists in every vault, a single one a list of one.
source: spec
notes:
  Ann.md: |
    ---
    tags: person
    cssclasses: wide
    ---
  Brita.md: |
    ---
    tags: [person, "#friend"]
    cssclasses: [wide]
    ---
expect:
  properties:
    Ann.md:
      tags: ['text #person']
      cssclasses: [text wide]
    Brita.md:
      tags: ['text #person', 'text #friend']
      cssclasses: [text wide]
