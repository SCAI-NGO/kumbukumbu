description: A tags property gives its tags with their '#', a single one as text, a '#' already written kept once; other properties are left as written.
source: spec
notes:
  Ann.md: |
    ---
    tags: person
    cssclasses: wide
    ---
  Brita.md: |
    ---
    tags: [person, "#friend"]
    cssclasses: [wide]
    ---
expect:
  properties:
    Ann.md:
      tags: 'text #person'
      cssclasses: text wide
    Brita.md:
      tags: ['text #person', 'text #friend']
      cssclasses: [text wide]
