description: A tags property gives its tags with their '#', a '#' already written kept once; other properties are left as written.
source: spec
notes:
  Brita.md: |
    ---
    tags: [person, "#friend"]
    cssclasses: [wide]
    ---
expect:
  properties:
    Brita.md:
      tags: ['text #person', 'text #friend']
      cssclasses: [text wide]
