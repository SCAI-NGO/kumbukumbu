description: A value that doesn't fit its declared type keeps its own value, rather than being lost.
source: spec
types:
  birthday: date
  rating: number
  done: checkbox
  scores: number
notes:
  Ann.md: |
    ---
    birthday: soon
    rating: high
    done: yes
    scores: [1, 2]
    ---
expect:
  properties:
    Ann.md:
      birthday: text soon
      rating: text high
      done: text yes
      scores: [number 1, number 2]
