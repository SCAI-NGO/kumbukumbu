description: Numbers read as YAML 1.2's core schema reads them, in decimal, exponent, hex and octal form, and its infinities and NaN.
source: spec
notes:
  Ann.md: |
    ---
    a: 1.50
    b: 1e3
    c: -7
    d: 0x1F
    e: .inf
    f: 0o17
    g: -.inf
    h: .Inf
    i: +.INF
    j: .nan
    k: 0x
    l: 0o8
    ---
expect:
  properties:
    Ann.md:
      a: number 1.5
      b: number 1000
      c: number -7
      d: number 31
      e: number Infinity
      f: number 15
      g: number -Infinity
      h: number Infinity
      i: number Infinity
      j: number NaN
      k: text 0x
      l: text 0o8
