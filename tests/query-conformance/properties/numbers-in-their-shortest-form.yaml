description: Numbers read in decimal and exponent form; YAML's hex, octal and infinity stay text, as a person meant them.
source: spec
notes:
  Ann.md: |
    ---
    a: 1.50
    b: 1e3
    c: -7
    d: 0x1F
    e: .inf
    f: 0o17
    ---
expect:
  properties:
    Ann.md:
      a: number 1.5
      b: number 1000
      c: number -7
      d: text 0x1F
      e: text .inf
      f: text 0o17
