description: Numbers read as YAML 1.2's core schema reads them, in decimal and exponent form, and its other infinities and NaN; what only looks like hex or octal stays text.
source: spec
notes:
  Ann.md: |
    ---
    a: 1.50
    b: 1e3
    c: -7
    g: -.inf
    h: .Inf
    i: +.INF
    j: .nan
    k: 0x
    l: 0o8
    ---
expect:
  properties:
    Ann.md:
      a: number 1.5
      b: number 1000
      c: number -7
      g: number -Infinity
      h: number Infinity
      i: number Infinity
      j: number NaN
      k: text 0x
      l: text 0o8
