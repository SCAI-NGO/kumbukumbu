description: A declared type holds for the property whatever the case it is written in.
source: kumbu
reason: Obsidian 1.15.1 ignores types.json for a base's values (finding 10), so a date declared a text stays a date; whoever declares a text means the text as written (ADR 0041).
types:
  Birthday: text
notes:
  Ann.md: |
    ---
    birthday: 1980-11-03
    ---
expect:
  properties:
    Ann.md:
      birthday: text 1980-11-03
