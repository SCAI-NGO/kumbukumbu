description: A column is file.x, formula.x, note.x or a property's name, spaces and all; a missing value is null.
source: spec
notes:
  Ann.md: |
    ---
    status: open
    my prop: 5
    ---
  Brita.md: ""
base: |
  formulas:
    twice: note["my prop"] * 2
  views:
    - type: table
      name: All
      order: [file.name, status, note.status, my prop, formula.twice]
runs:
  - columns: [file.name, status, note.status, my prop, formula.twice]
    rows:
      - [text Ann.md, text open, text open, number 5, number 10]
      - [text Brita.md, null, null, null, null]
