description: A view without a name makes the whole base an error, its named views too.
source: obsidian 1.15.1
notes:
  Ann.md: |
    ---
    age: 40
    ---
  Ben.md: |
    ---
    age: 30
    ---
base: |
  views:
    - type: table
      order: [file.basename]
    - type: table
      order: [file.basename, age]
      sort:
        - property: age
    - type: table
      name: Named
      order: [file.basename]
runs:
  - error: base
  - view: Named
    error: base
