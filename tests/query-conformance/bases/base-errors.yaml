description: A base that can't run says why before any row, an unknown view or an unknown filter group; an expression's error is a value in its cells, not an error of the base.
source: spec
notes:
  a.md: ""
base: |
  formulas:
    broken: nothing(1)
  views:
    - type: table
      name: Fine
      order: [file.name]
    - type: table
      name: Uses broken
      order: [file.name, formula.broken]
    - type: table
      name: Bad group
      filters:
        xor: [true]
    - type: table
      name: Bad syntax
      filters: "a &"
runs:
  - view: Fine
    columns: [file.name]
    rows: [[text a]]
  - view: Missing
    error: unknown-view
  - view: Uses broken
    columns: [file.name, formula.broken]
    rows: [[text a, error Cannot find function "nothing"]]
  - view: Bad group
    error: base
  - view: Bad syntax
    error: syntax
