description: A sort key without a direction sorts ascending; the direction ignores case; any other direction (up, or deſc with a long s, as case is ASCII's only) warns with sort-direction and sorts ascending. Empty values go last either way and ties keep path order.
source: kumbu
reason: Obsidian 1.15.1 sorts nothing for a key without a direction or with lower or mixed case asc/desc (finding 20); a person writing no direction means ascending (ADR 0041).
notes:
  a.md: |
    ---
    rank: 2
    ---
  b.md: |
    ---
    rank: 1
    ---
  c.md: |
    ---
    rank: 3
    ---
  d.md: |
    ---
    title: no rank
    ---
  e.md: |
    ---
    rank: 2
    ---
base: |
  views:
    - type: table
      name: Up
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: ASC }
    - type: table
      name: Down
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: DESC }
    - type: table
      name: None
      order: [file.basename, rank]
      sort:
        - { property: rank }
    - type: table
      name: Lower case
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: asc }
    - type: table
      name: Mixed case
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: Desc }
    - type: table
      name: Unknown
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: up }
    - type: table
      name: Long s
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: deſc }
    - type: table
      name: Lower case then upper
      order: [file.basename, rank]
      sort:
        - { property: rank, direction: asc }
        - { property: file.basename, direction: DESC }
