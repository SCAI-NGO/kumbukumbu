description: A regular expression matches a text through its matches(); one with an unknown or repeated flag, one that doesn't compile, or one that needs backtracking (lookaround, backreferences), which RE2 can't run, is null, not an error. Its toString() is how JavaScript writes it.
source: spec
notes:
  Ann.md: ""
