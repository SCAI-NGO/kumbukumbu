  # What runs means the same in both, as RE2 means it: \d and \w are ASCII, \s is [\t\n\f\r ], $ without m is the end
  # of the text, and i folds a letter with all its case forms.
  - { expression: '"Müller".replace(/\w+/, "X")', values: { Ann.md: text Xüller } }
