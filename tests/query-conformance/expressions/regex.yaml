description: A regular expression matches a text through its matches(); one with an unknown or repeated flag, one that doesn't compile, or one that needs backtracking (lookaround, backreferences), which RE2 can't run, is null, not an error. Its toString() is how JavaScript writes it.
source: spec
notes:
  Ann.md: ""
cases:
  - { expression: '/abc/.matches("abcde")', values: { Ann.md: boolean true } }
  - { expression: '/^ann/i.matches("Ann")', values: { Ann.md: boolean true } }
  - { expression: '/^b$/m.matches("a\nb")', values: { Ann.md: boolean true } }
  - { expression: '/a.b/.matches("a\nb")', values: { Ann.md: boolean false } }
  - { expression: '/a.b/s.matches("a\nb")', values: { Ann.md: boolean true } }
  - { expression: '/x/gu.matches("x")', values: { Ann.md: boolean true } }
  - { expression: '/x/.matches(missing)', values: { Ann.md: null } }
  - { expression: '/a/ii.matches("a")', values: { Ann.md: null } }
  - { expression: '/a(?=b)/.matches("ab")', values: { Ann.md: null } }
  - { expression: '/(a)\1/.matches("aa")', values: { Ann.md: null } }
  - { expression: '/a/y', values: { Ann.md: null } }
  # A regular expression shows as JavaScript writes it: the pattern, then its flags in their own order.
  - { expression: /a+b/.toString(), values: { Ann.md: text /a+b/ } }
  - { expression: /a+b/ig.toString(), values: { Ann.md: text /a+b/gi } }
  # What a pattern's counts expand to is bounded before it runs, as RE2 bounds a count to 1,000 (alone, or multiplied
  # through nesting): a pattern past either is null, as one RE2 can't run is.
  - { expression: '/x{0,200}/.matches("x")', values: { Ann.md: boolean true } }
  - { expression: '/x{0,201}/.matches("x")', values: { Ann.md: null } }
  - { expression: '/(?:a|aa|aaa|aaaa){0,20}c/.matches("a".repeat(1000))', values: { Ann.md: boolean false } }
  - { expression: '/(?:a|aa|aaa|aaaa){0,300}c/.matches("a".repeat(1000))', values: { Ann.md: null } }
  - { expression: '/(?:a|aa){0,1000}c/.matches("a".repeat(10000))', values: { Ann.md: null } }
  - { expression: '/a{1001}/.matches("a")', values: { Ann.md: null } }
  - { expression: '/(?:(?:){100}){100}/.matches("a")', values: { Ann.md: null } }
  - { expression: '/\d{4}-\d{2}-\d{2}/.matches("on 2026-11-26")', values: { Ann.md: boolean true } }

