  - { expression: '/^ann/i.matches("Ann")', values: { Ann.md: boolean true } }
  - { expression: '/^b$/m.matches("a\nb")', values: { Ann.md: boolean true } }
  - { expression: '/a.b/.matches("a\nb")', values: { Ann.md: boolean false } }
  - { expression: '/a.b/s.matches("a\nb")', values: { Ann.md: boolean true } }
