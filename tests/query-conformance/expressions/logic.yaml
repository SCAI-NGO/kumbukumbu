description: '&& and || give one of their operands, as in JavaScript; ! gives a checkbox; an error operand that is read is the result.'
source: kumbu
reason: Obsidian 1.15.1 gives a checkbox from && and || (finding 12), so missing || "none" is true; someone writing it means the fallback.
formulas:
  bad: nick * 2
notes:
  Ann.md: |
    ---
    nick: "N"
    zero: 0
    ---
cases:
  - { expression: missing || "none", values: { Ann.md: text none } }
  - { expression: nick && zero, values: { Ann.md: number 0 } }
  - { expression: '"" || 0', values: { Ann.md: number 0 } }
  - { expression: 1 && "x", values: { Ann.md: text x } }
  - { expression: '!missing', values: { Ann.md: boolean true } }
  - { expression: formula.bad || "x", values: { Ann.md: error Invalid operator between String and Number } }
  - { expression: nick || formula.bad, values: { Ann.md: text N } }
  - { expression: false && formula.bad, values: { Ann.md: boolean false } }
  - { expression: missing || formula.bad, values: { Ann.md: error Invalid operator between String and Number } }
  - { expression: true && formula.bad, values: { Ann.md: error Invalid operator between String and Number } }
