description: The global functions of Obsidian's reference that give data; file() and link() find a file as a link from the row's note does, and random() is one number per run and row.
source: spec
now: 2026-11-23T14:30:00
notes:
  People/Ann.md: |
    ---
    n: 7
    ---
  People/Brita.md: ""
