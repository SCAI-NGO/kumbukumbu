description: An error taints whatever uses it, an operator, a method, a function's argument, if's condition, && and ||; a branch of if not taken is not evaluated.
source: spec
formulas:
  bad: name * 2
notes:
  Ann.md: |
    ---
    name: Ann
    n: 7
    ---
