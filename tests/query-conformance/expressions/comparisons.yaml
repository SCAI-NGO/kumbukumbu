description: Values compare within their type; across types they are unequal and not ordered, and null is equal only to null.
source: spec
notes:
  Ann.md: |
    ---
    n: 11
    t: "11"
    ---
cases:
  - { expression: n == 11, values: { Ann.md: boolean true } }
  - { expression: t == 11, values: { Ann.md: boolean false } }
  - { expression: t == "11", values: { Ann.md: boolean true } }
  - { expression: n != t, values: { Ann.md: boolean true } }
  - { expression: n > 10 && n <= 11, values: { Ann.md: boolean true } }
  - { expression: t > 10, values: { Ann.md: boolean false } }
  - { expression: '"b" > "a"', values: { Ann.md: boolean true } }
  - { expression: missing == null, values: { Ann.md: boolean true } }
  - { expression: missing < 5, values: { Ann.md: boolean false } }
  - { expression: missing > 5, values: { Ann.md: boolean false } }
  - { expression: '[1, "a"] == [1, "a"]', values: { Ann.md: boolean true } }
