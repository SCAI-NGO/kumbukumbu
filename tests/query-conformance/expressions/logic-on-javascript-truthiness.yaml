description: '&&, || and ! read truth as JavaScript counts it: null, false, 0, NaN and "" are false; any other text, an empty list and an object are true.'
source: kumbu
reason: Obsidian 1.15.1 gives a checkbox from && and || (finding 12); here they give the operand JavaScript would, as logic.yaml shows.
notes:
  Ann.md: |
    ---
    nick: Annie
    zero: 0
    empty: ""
    ---
cases:
  - { expression: nick || "none", values: { Ann.md: text Annie } }
  - { expression: missing || zero, values: { Ann.md: number 0 } }
  - { expression: nick && "yes", values: { Ann.md: text yes } }
  - { expression: empty && true, values: { Ann.md: text } }
  - { expression: '!empty', values: { Ann.md: boolean true } }
  - { expression: '!nick', values: { Ann.md: boolean false } }
  - { expression: '!zero && !missing', values: { Ann.md: boolean true } }
  - { expression: '"0" && true', values: { Ann.md: boolean true } }
  - { expression: '[] && true', values: { Ann.md: boolean true } }
  - { expression: '{} && true', values: { Ann.md: boolean true } }
  - { expression: 0 / 0 || false, values: { Ann.md: boolean false } }
