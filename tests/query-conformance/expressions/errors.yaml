description: What no note can make right is an error value in the cell, with Obsidian's message, not an error of the query; an unknown method on null is null.
source: obsidian 1.15.1
formulas:
  a: formula.b
  b: formula.a
notes:
  Ann.md: |
    ---
    name: Ann
    ---
cases:
  - { expression: nothing(1), values: { Ann.md: error Cannot find function "nothing" } }
  - { expression: name.shout(), values: { Ann.md: error Cannot find function "shout" on type String } }
  - { expression: missing.shout(), values: { Ann.md: null } }
  - { expression: formula.missing, values: { Ann.md: error Cannot find "missing" on type Formulas } }
  - { expression: formula.a, values: { Ann.md: error Infinite loop detected in formula } }
  - { expression: formula.b, values: { Ann.md: error Infinite loop detected in formula } }
