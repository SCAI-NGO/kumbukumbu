description: A date plus or minus a text of durations (y M w d h m s, or their names in any case, several in one text, a minus allowed) is a date; months clamp the day; hours, minutes and seconds give a date without a time one, the other units keep whether it has one; a text that isn't a duration is an error in the cell.
source: spec
now: 2026-11-23T14:30:00
