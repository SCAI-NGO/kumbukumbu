description: Every file has the fields of its file; an attachment or a base file keeps its extension in its name and has no properties or tags; size is in bytes, ctime and mtime are the file's times.
source: spec
notes:
  People/Ann.md: |
    ---
    status: grün
    ---
    #person
  Lists/All.base: |
    views:
      - type: table
        name: All
  photo.png: |
    #not-a-tag
times:
  People/Ann.md: { ctime: 2026-11-20T09:15:00, mtime: 2026-11-24T18:00:00 }
  photo.png: { ctime: 2026-11-21T08:00:00, mtime: 2026-11-21T08:00:00 }
cases:
  - expression: file.name
    values: { People/Ann.md: text Ann, Lists/All.base: text All.base, photo.png: text photo.png }
  - expression: file.basename
    values: { People/Ann.md: text Ann, Lists/All.base: text All, photo.png: text photo }
  - expression: file.ext
    values: { People/Ann.md: text md, Lists/All.base: text base, photo.png: text png }
  - expression: file.folder
    values: { People/Ann.md: text People, Lists/All.base: text Lists, photo.png: text / }
  - expression: file.size
    values: { People/Ann.md: number 30, Lists/All.base: number 37, photo.png: number 11 }
  - expression: file.ctime
    values: { People/Ann.md: datetime 2026-11-20T09:15:00, Lists/All.base: null, photo.png: datetime 2026-11-21T08:00:00 }
  - expression: file.mtime
    values: { People/Ann.md: datetime 2026-11-24T18:00:00, Lists/All.base: null, photo.png: datetime 2026-11-21T08:00:00 }
  - expression: file.properties
    values: { People/Ann.md: { status: text grün }, Lists/All.base: {}, photo.png: {} }
  - expression: file.hasProperty("status")
    values: { People/Ann.md: boolean true, Lists/All.base: boolean false, photo.png: boolean false }
  - expression: file.tags.length
    values: { People/Ann.md: number 1, Lists/All.base: number 0, photo.png: number 0 }
