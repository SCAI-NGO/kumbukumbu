services:
  mongo:
    image: ${KUMBU_MONGO_IMAGE:-mongo:8}
    # A single-node replica set: MongoDB has transactions only on a replica set.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # The replica set config stores the member's host; the default hostname (the container id)
    # changes whenever the container is recreated, and the node would lose its own set.
    hostname: mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the set on the first start (idempotent), then reports whether this node is the
      # writable primary, which takes a few seconds after every start.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      start_interval: 1s
      retries: 10

  kumbu:
    build: .
    ports:
      # Localhost only. To reach it from other machines, drop "127.0.0.1:" on purpose:
      # traffic is plain HTTP and the only guard is the dev token.
      - "127.0.0.1:${KUMBU_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      Kumbu__Mongo__ConnectionString: mongodb://mongo:27017/?directConnection=true
      Kumbu__DevToken: ${KUMBU_DEV_TOKEN:?set KUMBU_DEV_TOKEN in .env}
      Kumbu__Seed__Path: /seed
      # New vaults' recovery keys are written here, once; fetch them, store them safely, delete them.
      Kumbu__Recovery__Path: /recovery
      Kumbu__Recovery__Keys: ${KUMBU_RECOVERY_KEYS:-}
    volumes:
      # A directory, not a symlink: symlinked vault folders do not resolve inside the container.
      - ${KUMBU_VAULTS:-./vaults}:/seed:ro
      - recovery-keys:/recovery

volumes:
  mongo-data:
  recovery-keys:
