services:
  mongo:
    image: ${KUMBU_MONGO_IMAGE:-mongo:8}
    # A single-node replica set: MongoDB has transactions only on a replica set.
    # Optional authentication: with KUMBU_MONGO_PASSWORD set, MongoDB requires a login. A replica set with
    # authentication needs a key file (its members authenticate each other with it, even a single one); it is
    # generated once, here, inside the data volume, never in the repository. The root user `kumbu` is created by
    # the health check below through MongoDB's localhost exception, which holds only while no user exists.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -z "$$KUMBU_MONGO_PASSWORD" ]; then exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all; fi
        key=/data/db/kumbu.keyfile
        if [ ! -s "$$key" ]; then (umask 077; tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 756 > "$$key"); fi
        chown mongodb:mongodb "$$key"
        chmod 400 "$$key"
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile "$$key"
    environment:
      KUMBU_MONGO_PASSWORD: ${KUMBU_MONGO_PASSWORD:-}
    # The replica set config stores the member's host; the default hostname (the container id)
    # changes whenever the container is recreated, and the node would lose its own set.
    hostname: mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the set on the first start (idempotent), then reports whether this node is the
      # writable primary, which takes a few seconds after every start. With a password, it signs in first;
      # while no user exists yet, it initiates the set and creates the root user once the node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          const pwd = process.env.KUMBU_MONGO_PASSWORD;
          const admin = db.getSiblingDB('admin');
          let signedIn = !pwd;
          if (pwd) { try { admin.auth('kumbu', pwd); signedIn = true; } catch (e) {} }
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          if (!db.hello().isWritablePrimary) quit(1);
          if (!signedIn) { admin.createUser({ user: 'kumbu', pwd, roles: ['root'] }); admin.auth('kumbu', pwd); }
          quit(0);
      interval: 5s
      timeout: 10s
      start_period: 30s
      start_interval: 1s
      retries: 10

  kumbu:
    # The published image; for local development compose.build.yaml adds `build: .` (see .envrc).
    image: ${KUMBU_IMAGE:-ghcr.io/scai-ngo/kumbukumbu:latest}
    ports:
      # Localhost only. To reach it from other machines, drop "127.0.0.1:" on purpose:
      # traffic is plain HTTP and the only guard is a key.
      - "127.0.0.1:${KUMBU_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      Kumbu__Mongo__ConnectionString: mongodb://mongo:27017/?directConnection=true
      # Optional; set, the server signs in to MongoDB as `kumbu` (see the mongo service). Empty, it doesn't.
      Kumbu__Mongo__Password: ${KUMBU_MONGO_PASSWORD:-}
      # Optional: empty, the dev token opens nothing (a public instance), and seeding is skipped.
      Kumbu__DevToken: ${KUMBU_DEV_TOKEN:-}
      # Where users reach the server; invitation links (and `kumbu bootstrap-admin`) are built from it.
      Kumbu__PublicUrl: ${KUMBU_PUBLIC_URL:-}
      Kumbu__Seed__Path: /seed
      # New vaults' recovery keys are written here, once; fetch them, store them safely, delete them.
      Kumbu__Recovery__Path: /recovery
      Kumbu__Recovery__Keys: ${KUMBU_RECOVERY_KEYS:-}
      # Only behind a reverse proxy that is the only way in: with the port above published, clients could
      # send their own X-Forwarded-For and pick the IP that rate limits count against.
      Kumbu__Proxy__Trusted: ${KUMBU_TRUSTED_PROXY:-false}
      Kumbu__Vaults__CheckpointLimit: ${KUMBU_CHECKPOINT_LIMIT:-10}
      # The embedding model for semsearch, downloaded here on the first start (about 630 MB for arctic-m, 1.1 GB for arctic-l).
      Kumbu__Search__ModelPath: /models
      Kumbu__Search__Enabled: ${KUMBU_SEARCH:-true}
      Kumbu__Search__Model: ${KUMBU_SEARCH_MODEL:-arctic-m}
    volumes:
      # A directory, not a symlink: symlinked vault folders do not resolve inside the container.
      - ${KUMBU_VAULTS:-./vaults}:/seed:ro
      - recovery-keys:/recovery
      - models:/models

volumes:
  mongo-data:
  recovery-keys:
  models:
