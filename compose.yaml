services:
  mongo:
    image: ${KUMBU_MONGO_IMAGE:-mongo:8}
    # A single-node replica set: MongoDB has transactions only on a replica set.
    # Optional authentication: with KUMBU_MONGO_PASSWORD set (or KUMBU_MONGO_PASSWORD_FILE naming a Docker secret
    # inside the container, see the README), MongoDB requires a login. A replica set with
    # authentication needs a key file (its members authenticate each other with it, even a single one); it is
    # generated once, here, inside the data volume, never in the repository. The root user `kumbu` is created by
    # the health check below through MongoDB's localhost exception, which holds only while no user exists.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        pwd="$$KUMBU_MONGO_PASSWORD"
        if [ -z "$$pwd" ] && [ -n "$$KUMBU_MONGO_PASSWORD_FILE" ]; then pwd="$$(cat "$$KUMBU_MONGO_PASSWORD_FILE")"; fi
        if [ -z "$$pwd" ]; then exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all; fi
        key=/data/db/kumbu.keyfile
        if [ ! -s "$$key" ]; then (umask 077; tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 756 > "$$key"); fi
        chown mongodb:mongodb "$$key"
        chmod 400 "$$key"
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile "$$key"
    environment:
      KUMBU_MONGO_PASSWORD: ${KUMBU_MONGO_PASSWORD:-}
    # The replica set config stores the member's host; the default hostname (the container id)
    # changes whenever the container is recreated, and the node would lose its own set.
    hostname: mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the set on the first start (idempotent), then reports whether this node is the
      # writable primary, which takes a few seconds after every start. With a password, it signs in first;
      # while no user exists yet, it initiates the set and creates the root user once the node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          const file = process.env.KUMBU_MONGO_PASSWORD_FILE;
          const pwd = process.env.KUMBU_MONGO_PASSWORD || (file ? require('fs').readFileSync(file, 'utf8').replace(/[\r\n]+$$/, '') : '');
          const admin = db.getSiblingDB('admin');
          let signedIn = !pwd;
          if (pwd) { try { admin.auth('kumbu', pwd); signedIn = true; } catch (e) {} }
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          if (!db.hello().isWritablePrimary) quit(1);
          if (!signedIn) { admin.createUser({ user: 'kumbu', pwd, roles: ['root'] }); admin.auth('kumbu', pwd); }
          quit(0);
      interval: 5s
      timeout: 10s
      start_period: 30s
      start_interval: 1s
      retries: 10

  kumbu:
    # The published image; for local development compose.build.yaml adds `build: .` (see .envrc).
    image: ${KUMBU_IMAGE:-ghcr.io/scai-ngo/kumbukumbu:latest}
    ports:
      # Localhost only. To reach it from other machines, drop "127.0.0.1:" on purpose:
      # traffic is plain HTTP and the only guard is a key.
      - "127.0.0.1:${KUMBU_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      # Started along with the server, but not waited for: without the sidecar the server runs, and img, pdf's pages
      # and new PDFs' analyses say they are unavailable until it is back.
      pdf:
        condition: service_started
        required: false
    environment:
      Kumbu__Mongo__ConnectionString: mongodb://mongo:27017/?directConnection=true
      # Optional; set, the server signs in to MongoDB as `kumbu` (see the mongo service). Empty, it doesn't.
      # Kumbu__Mongo__PasswordFile in its place reads it from a file (a Docker secret, see the README).
      Kumbu__Mongo__Password: ${KUMBU_MONGO_PASSWORD:-}
      # Optional: empty, the dev token opens nothing (a public instance), and seeding is skipped.
      Kumbu__DevToken: ${KUMBU_DEV_TOKEN:-}
      # Where users reach the server; invitation links (and `kumbu bootstrap-admin`) are built from it.
      Kumbu__PublicUrl: ${KUMBU_PUBLIC_URL:-}
      Kumbu__Seed__Path: /seed
      # New vaults' recovery keys are written here, once; fetch them, store them safely, delete them.
      Kumbu__Recovery__Path: /recovery
      Kumbu__Recovery__Keys: ${KUMBU_RECOVERY_KEYS:-}
      # Only behind a reverse proxy that is the only way in from outside the host: with the port above published,
      # clients could send their own X-Forwarded-For and pick the IP that rate limits count against.
      Kumbu__Proxy__Trusted: ${KUMBU_TRUSTED_PROXY:-false}
      Kumbu__Vaults__CheckpointLimit: ${KUMBU_CHECKPOINT_LIMIT:-10}
      Kumbu__OAuth__AccessTokenMinutes: ${KUMBU_OAUTH_ACCESS_TOKEN_MINUTES:-60}
      # Optional: the privacy contact the reply to a deletion request is signed with (Admin → Users).
      Kumbu__Privacy__Contact: ${KUMBU_PRIVACY_CONTACT:-}
      # The ids of deleted users (no names), outside the database: after a restore, the admins are warned about
      # users it brought back. Keep this volume out of database restores.
      Kumbu__Deletions__Path: /deletions
      # The embedding model for semsearch, downloaded here on the first start (about 630 MB for arctic-m, 1.1 GB for arctic-l).
      Kumbu__Search__ModelPath: /models
      Kumbu__Search__Enabled: ${KUMBU_SEARCH:-true}
      Kumbu__Search__Model: ${KUMBU_SEARCH_MODEL:-arctic-m}
      # The embedding provider of vaults whose owner never chose one: internal, or an external provider's name.
      Kumbu__Embeddings__Default: ${KUMBU_EMBEDDINGS_DEFAULT:-internal}
      # Prometheus metrics, for compose.monitoring.yaml: not published, but reachable from every container on a network of the server's.
      Kumbu__Metrics__Url: http://0.0.0.0:9464
      # The PDF sidecar below, which parses PDFs and decodes images for img and pdf; empty, neither shows anything.
      Kumbu__Pdf__Url: http://pdf:8090
    networks:
      - default
      - pdf
    volumes:
      # A directory, not a symlink: symlinked vault folders do not resolve inside the container.
      - ${KUMBU_VAULTS:-./vaults}:/seed:ro
      - recovery-keys:/recovery
      - deletions:/deletions
      - models:/models

  pdf:
    # The PDF sidecar (pdf/): untrusted PDFs are parsed, and untrusted images decoded, here, never in the server, which
    # holds the vault keys. Stateless; it gets the bytes of one file per request and keeps nothing. Take it from the same
    # release as the server (README, "Images and releases").
    image: ${KUMBU_PDF_IMAGE:-ghcr.io/scai-ngo/kumbukumbu-pdf:latest}
    restart: unless-stopped
    # Only on `pdf`, an internal network shared with the server alone: no route out, and nothing else reaches it.
    networks:
      - pdf
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image's `node` user.
    user: "1000:1000"
    # Two workers of at most 384 MB of JavaScript heap each (768 MB), plus what lives outside it: pdf.js's decoded
    # images (up to 50 MP, 200 MB at 4 bytes a pixel) and Skia's canvases (a large step is at most 3.7 MP, but a page
    # or an image decoded for scaling can be larger), and the main thread's buffers (at most 18 bodies of 16 MiB).
    # Past the limit the kernel kills the whole sidecar, which restarts; the server gives up on a PDF that keeps
    # doing it after a few tries.
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 128

networks:
  pdf:
    internal: true

volumes:
  mongo-data:
  recovery-keys:
  deletions:
  models:
