# The public shape: Kumbu² behind Traefik, with a Let's Encrypt certificate.
#
#   docker compose -f compose.yaml -f compose.traefik.yaml up -d
#
# (or COMPOSE_FILE=compose.yaml:compose.traefik.yaml in .env, then plain `docker compose up -d`). Needs KUMBU_HOST in
# .env, a DNS A record (and AAAA, if any) for it pointing at this host, and ports 80 and 443 free and reachable.
#
# What it changes against compose.yaml:
# - Traefik is the only way in: Kumbu²'s port is no longer published on the host, Traefik listens on 80 and 443,
#   redirects http to https and terminates TLS. The certificate comes from Let's Encrypt through the TLS-ALPN
#   challenge on port 443.
# - Kumbu² trusts the proxy (Kumbu:Proxy:Trusted): it takes the client address for its rate limits from the last
#   X-Forwarded-For entry, the one Traefik appends, and the scheme from X-Forwarded-Proto, which Traefik sets. Traefik
#   doesn't pass on the X-Forwarded-* headers a client sends (no forwardedHeaders.trustedIPs here), so a client can't
#   pick its address. Safe only because nothing but Traefik can reach the container: keep it that way.
# - Two networks: `proxy` (Traefik and Kumbu²) and the default one (Kumbu² and MongoDB), now internal. Traefik never
#   sees MongoDB, and MongoDB has no way out. Kumbu² reaches the internet through `proxy` (model download, OAuth client
#   metadata, external embedding providers).
# - KUMBU_PUBLIC_URL is https://${KUMBU_HOST}; a KUMBU_PUBLIC_URL in .env is not used.
#
# Left as it is, on purpose: Strict-Transport-Security and the other security headers come from Kumbu² itself (with
# an https public URL, on every response), so Traefik adds none. Traefik sets no limit on request bodies, so uploads up
# to Kumbu²'s 15 MB pass and a larger one gets Kumbu²'s own 413. WebSockets (Obsidian sync hints on /api/ws) pass
# without configuration. Traefik keeps no access log (its default); if you turn one on, keep /api out of it (README,
# "Security notes for a public instance").
#
# Already running Traefik for other services? Then don't use this file: copy the kumbu service below (labels,
# networks, `ports: !reset []`, the Kumbu__ settings) into a compose.override.yaml, declare `proxy` as your Traefik's
# network with `external: true` and its `name:`, and use your entry point and certificate resolver names in the labels.
# Every container on that shared network can then reach Kumbu² on port 8080 directly and send its own X-Forwarded-For,
# and read its metrics on port 9464 without a credential, so give Kumbu² a network of its own with Traefik where you can.

services:
  traefik:
    image: ${KUMBU_TRAEFIK_IMAGE:-traefik:v3.7}
    restart: unless-stopped
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --providers.docker=true
      # Only containers labelled traefik.enable=true, reached over the proxy network.
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=kumbu-proxy
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      # Traefik's default of 60 s for reading a whole request would cut off a 15 MB upload slower than about
      # 2 Mbit/s (a phone on a weak network). Kestrel drops a body that trickles in below 240 bytes a second.
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=10m
      - --certificatesResolvers.letsencrypt.acme.tlsChallenge=true
      # The HTTP challenge on port 80 works as well (in place of the line above), for instance where 443 is
      # forwarded through something that terminates TLS itself:
      # - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      - --certificatesResolvers.letsencrypt.acme.email=${KUMBU_ACME_EMAIL:-}
      - --certificatesResolvers.letsencrypt.acme.caServer=${KUMBU_ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Traefik reads the labels below through the Docker API. Read-only limits the mount, not the API: whoever
      # controls Traefik controls Docker. A socket proxy that allows only reading containers narrows that.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy

  kumbu:
    restart: unless-stopped
    # No port on the host: Traefik is the only way in, which is what Kumbu__Proxy__Trusted relies on.
    ports: !reset []
    environment:
      Kumbu__PublicUrl: https://${KUMBU_HOST:?set KUMBU_HOST in .env to the host name Kumbu² is reached at}
      Kumbu__Proxy__Trusted: "true"
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      # Everything on the host goes to Kumbu²: the web app, /api (with the WebSocket), /mcp, /oauth and /.well-known.
      - traefik.http.routers.kumbu.rule=Host(`${KUMBU_HOST}`)
      - traefik.http.routers.kumbu.entrypoints=websecure
      - traefik.http.routers.kumbu.tls.certresolver=letsencrypt
      - traefik.http.services.kumbu.loadbalancer.server.port=8080

  mongo:
    restart: unless-stopped

networks:
  default:
    # MongoDB and Kumbu² only: no route out, and no other container on it.
    internal: true
  proxy:
    name: kumbu-proxy
    # Clients that come over IPv6 reach Traefik through Docker's userland proxy on a network without IPv6, so
    # Traefik (and Kumbu²'s rate limits) see one Docker address for all of them. On a host with IPv6, turn it on:
    # enable_ipv6: true

volumes:
  letsencrypt:
