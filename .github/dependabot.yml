# Keeps what the build pulls in up to date, each pinned where it is used: the actions to commit hashes in the
# workflows, the base images to digests in the Dockerfiles, the NuGet packages to the versions in the project files
# and packages.lock.json, the PDF sidecar's npm packages to pdf/pnpm-lock.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /pdf
    schedule:
      interval: weekly

  # A pdfjs-dist update changes the analyser: change PdfAnalyses.Analyser (src/Kumbu.Server/Attachments/PdfAnalyses.cs)
  # and the tests that pin it (PdfSidecarTests, PdfCommandTests, pdf/test/analyse.test.ts) in the same pull request.
  # Every PDF is then analysed again once.
  - package-ecosystem: npm
    directory: /pdf
    schedule:
      interval: weekly
