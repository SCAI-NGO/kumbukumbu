# Keeps what the build pulls in up to date, each pinned where it is used: the actions to commit hashes in the
# workflows, the base images to digests in the Dockerfiles, the NuGet packages to the versions in the project files
# and packages.lock.json, the npm packages of the workspace (web app, Eidolon core) and of the PDF sidecar to their
# pnpm-lock.yaml. And the images the Compose files run, by their tags: Prometheus and Grafana in
# compose.monitoring.yaml, and the defaults of KUMBU_MONGO_IMAGE and KUMBU_TRAEFIK_IMAGE (`${…:-image:tag}`), whose
# tags name a major or minor version only, so a pull request there is a new major or minor version: review it.
#
# Node only on its LTS lines, the even majors: an odd major is never LTS and is out of support within months.
# A new even major is due each April and becomes LTS in October; move to it then, so no LTS line is skipped.
#
# .NET likewise only on its LTS lines, the even majors: an odd major is supported as long as the LTS before it (both
# end in the same November), so taking it would only add a framework jump a year. A new even major comes each
# November; move to it then (.NET 12 in November 2027). The ASP.NET Core packages and System.Numerics.Tensors follow
# the framework's major and wait with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        versions: ["27.x", "29.x", "31.x", "33.x"]
      - dependency-name: dotnet/*
        versions: ["11.x", "13.x", "15.x"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Microsoft.AspNetCore.*
        versions: ["11.x", "13.x", "15.x"]
      - dependency-name: System.Numerics.Tensors
        versions: ["11.x", "13.x", "15.x"]

  # The pnpm workspace at the root: the web app and the Eidolon core (packages/), one lockfile. The web app has many
  # packages: their minor and patch updates come as one pull request a week, a major one on its own. pdfjs-dist stays
  # out of the group: people and the model see the same pages (docs/security-architecture.md), so it moves together
  # with the sidecar's, in one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns: [pdfjs-dist]
    ignore:
      - dependency-name: "@types/node"
        versions: ["27.x", "29.x", "31.x", "33.x"]

  - package-ecosystem: docker
    directory: /pdf
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        versions: ["27.x", "29.x", "31.x", "33.x"]

  # A pdfjs-dist update changes the analyser: change PdfAnalyses.Analyser (src/Kumbu.Server/Attachments/PdfAnalyses.cs)
  # and the tests that pin it (PdfSidecarTests, PdfCommandTests, pdf/test/analyse.test.ts) in the same pull request,
  # and move web/package.json's pdfjs-dist to the same version. Every PDF is then analysed again once.
  - package-ecosystem: npm
    directory: /pdf
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        versions: ["27.x", "29.x", "31.x", "33.x"]
