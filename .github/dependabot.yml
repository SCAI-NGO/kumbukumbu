# Keeps what the build pulls in up to date, each pinned where it is used: the actions to commit hashes in the
# workflows, the base images to digests in the Dockerfiles, the NuGet packages to the versions in the project files
# and packages.lock.json, the web app's and the PDF sidecar's npm packages to their pnpm-lock.yaml. And the images
# the Compose files run, by their tags: Prometheus and Grafana in compose.monitoring.yaml, and the defaults of
# KUMBU_MONGO_IMAGE and KUMBU_TRAEFIK_IMAGE (`${…:-image:tag}`), whose tags name a major or minor version only, so a
# pull request there is a new major or minor version: review it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly

  # The web app has many packages: their minor and patch updates come as one pull request a week, a major one on its
  # own. pdfjs-dist stays out of the group: people and the model see the same pages (docs/security-architecture.md),
  # so it moves together with the sidecar's, in one pull request.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns: [pdfjs-dist]
    ignore:
      - dependency-name: "@types/node"
        versions: ["27.x", "29.x", "31.x", "33.x"]

  - package-ecosystem: docker
    directory: /pdf
    schedule:
      interval: weekly

  # A pdfjs-dist update changes the analyser: change PdfAnalyses.Analyser (src/Kumbu.Server/Attachments/PdfAnalyses.cs)
  # and the tests that pin it (PdfSidecarTests, PdfCommandTests, pdf/test/analyse.test.ts) in the same pull request,
  # and move web/package.json's pdfjs-dist to the same version. Every PDF is then analysed again once.
  - package-ecosystem: npm
    directory: /pdf
    schedule:
      interval: weekly
