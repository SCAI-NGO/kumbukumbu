name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The server tests share one app fixture and run one after another: 13.7 minutes in one job. Split by namespace
    # across runners, each with its own MongoDB, they take a few minutes each without more load on any machine.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: api
            filter: --filter-namespace Kumbu.Server.Tests.Api --filter-namespace Kumbu.Server.Tests.Mcp --filter-namespace Kumbu.Server.Tests.Auth --filter-namespace Kumbu.Server.Tests.Net
          - shard: accounts
            filter: --filter-namespace Kumbu.Server.Tests.Accounts --filter-namespace Kumbu.Server.Tests.Sharing --filter-namespace Kumbu.Server.Tests.Welcome
          - shard: vaults
            filter: --filter-namespace Kumbu.Server.Tests.Vaults --filter-namespace Kumbu.Server.Tests.Skills --filter-namespace Kumbu.Server.Tests.Search --filter-namespace Kumbu.Server.Tests.Metrics
          # Everything the shards above don't name, so a new namespace is never left out; and the core tests.
          - shard: rest
            core: true
            filter: >-
              --filter-not-namespace Kumbu.Server.Tests.Api --filter-not-namespace Kumbu.Server.Tests.Mcp
              --filter-not-namespace Kumbu.Server.Tests.Auth --filter-not-namespace Kumbu.Server.Tests.Net
              --filter-not-namespace Kumbu.Server.Tests.Accounts --filter-not-namespace Kumbu.Server.Tests.Sharing
              --filter-not-namespace Kumbu.Server.Tests.Welcome --filter-not-namespace Kumbu.Server.Tests.Vaults
              --filter-not-namespace Kumbu.Server.Tests.Skills --filter-not-namespace Kumbu.Server.Tests.Search
              --filter-not-namespace Kumbu.Server.Tests.Metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Locked: a project whose packages differ from its packages.lock.json fails here.
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore
      # arctic-m's tokenizer, pinned by its SHA-256, so the token-bound tests run instead of skipping.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kumbu
          key: tokenizer-f1cc44ad7faaeec47241864835473fd5403f2da94673f3f764a77ebcb0a803ec
      - name: Fetch the tokenizer
        run: |
          mkdir -p "$HOME/.cache/kumbu"
          if [ ! -f "$HOME/.cache/kumbu/tokenizer.json" ]; then
            curl -fsSL --retry 3 --retry-all-errors -o "$HOME/.cache/kumbu/tokenizer.json" https://huggingface.co/Snowflake/snowflake-arctic-embed-m-v2.0/resolve/95c2741480856aa9666782eb4afe11959938017f/tokenizer.json
          fi
          echo "f1cc44ad7faaeec47241864835473fd5403f2da94673f3f764a77ebcb0a803ec  $HOME/.cache/kumbu/tokenizer.json" | sha256sum -c -
          echo "KUMBU_TOKENIZER=$HOME/.cache/kumbu/tokenizer.json" >> "$GITHUB_ENV"
      - if: matrix.core
        run: dotnet test --project tests/Kumbu.Core.Tests --configuration Release --no-build
      - run: dotnet test --project tests/Kumbu.Server.Tests --configuration Release --no-build -- ${{ matrix.filter }}

  pdf:
    name: PDF sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # pnpm at the version pdf/package.json's packageManager names, as the image build takes it.
      - run: npm install -g pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # pnpm at the version web/package.json's packageManager names, as the image build takes it.
      - run: npm install -g pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  # The litmus WebDAV compliance suites against a running server (WebDAV design §7), in a dot-folder of a vault, so
  # through the parking area; tools/litmus/expected-failures.txt lists the deliberate deviations.
  litmus:
    name: WebDAV (litmus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:8080
      Kumbu__PublicUrl: http://127.0.0.1:8080
      Kumbu__Mongo__ConnectionString: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      Kumbu__Mongo__Database: litmus
      Kumbu__Search__Enabled: "false"
      Kumbu__Metrics__Enabled: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y litmus
      # A service container can't be given --replSet, so MongoDB runs from a step, as a single-node replica set
      # (the server's change streams and transactions need one), initiated as the tests' TestImages does it.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 60); do
            docker exec mongo mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}).ok }' 2>/dev/null | grep -q 1 && break
            sleep 1
          done
          for i in $(seq 60); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true && exit 0
            sleep 1
          done
          exit 1
      - run: dotnet restore --locked-mode src/Kumbu.Server
      - run: dotnet build --configuration Release --no-restore src/Kumbu.Server
      - name: Start the server
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "KUMBU_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          link="$(dotnet run --no-build --configuration Release --project src/Kumbu.Server -- bootstrap-admin)"
          echo "::add-mask::$link"
          echo "KUMBU_INVITATION=$link" >> "$GITHUB_ENV"
          nohup dotnet run --no-build --configuration Release --project src/Kumbu.Server > server.log 2>&1 &
          for i in $(seq 120); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - run: tools/litmus/run.sh http://127.0.0.1:8080 litmus
      - name: Server log
        if: failure()
        run: cat server.log
